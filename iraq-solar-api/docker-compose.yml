services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres_secure_pass_2026@postgres:5432/iraq_solar_db?sslmode=disable
      - JWT_SECRET=production-iraq-solar-super-secret-key-2026
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_started
    restart: always

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: iraq_solar_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass_2026
      POSTGRES_DB: iraq_solar_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
      - ./migrations/002_admin_extensions.sql:/docker-entrypoint-initdb.d/002_admin_extensions.sql
      - ./migrations/003_add_store_verification.sql:/docker-entrypoint-initdb.d/003_add_store_verification.sql
      - ./migrations/004_add_product_ownership_stock.sql:/docker-entrypoint-initdb.d/004_add_product_ownership_stock.sql
      - ./migrations/005_add_order_status_history.sql:/docker-entrypoint-initdb.d/005_add_order_status_history.sql
      - ./migrations/006_delivery_fee_flags.sql:/docker-entrypoint-initdb.d/006_delivery_fee_flags.sql
      - ./migrations/007_search_indexes.sql:/docker-entrypoint-initdb.d/007_search_indexes.sql
      - ./migrations/008_add_stores_and_branches.sql:/docker-entrypoint-initdb.d/008_add_stores_and_branches.sql
      - ./migrations/009_add_brands.sql:/docker-entrypoint-initdb.d/009_add_brands.sql
      - ./migrations/010_usd_to_iqd_and_product_brand.sql:/docker-entrypoint-initdb.d/010_usd_to_iqd_and_product_brand.sql
      - ./migrations/011_orders_branch_relation.sql:/docker-entrypoint-initdb.d/011_orders_branch_relation.sql
      - ./migrations/012_add_location_hierarchy.sql:/docker-entrypoint-initdb.d/012_add_location_hierarchy.sql
      - ./migrations/013_add_auth_security_tables.sql:/docker-entrypoint-initdb.d/013_add_auth_security_tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iraq_solar_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  redis:
    image: redis:7-alpine
    container_name: iraq_solar_redis
    ports:
      - "6379:6379"
    restart: always

  minio:
    image: minio/minio:latest
    container_name: iraq_solar_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: iraqsolar
      MINIO_ROOT_PASSWORD: iraqsolar_minio_2026
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always

volumes:
  postgres_data:
  minio_data:
